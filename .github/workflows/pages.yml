name: Publish website
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage website files only
        run: |
          mkdir -p _site/data
          cp index.html theme.css directory.js rankings.js player-power.js merge.js vault.js profiles.js server.js _site/
          cp logo.png favicon-32.png apple-touch-icon.png hero-radar.png og-image.png robots.txt sitemap.xml _site/
          cp -r img _site/
          cp data/site.enc.json data/sample.json data/profiles.enc.json data/profiles-detail.enc.json data/server.enc.json data/dimension.enc.json data/power.enc.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for artifact to become visible
        # deploy-pages looks the artifact up right after upload; GitHub's API is sometimes ~1s behind ("Found 0 artifact(s)").
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
